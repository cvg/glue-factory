data:
  preprocessing:
    side: long
    resize: 512

model:
  name: two_view_pipeline
  extractor:
    name: grid_extractor
  matcher:
    name: gluefactory_nonfree.mast3r
    return_decoder_features: true
  filter:
    name: gluefactory_nonfree.doppelgangers
    weights: dg

pipeline:
  name: reconstruction.mast3r_sfm
  doppelgangers:
    threshold: 0.8

benchmarks:
  eth3d_reconstruction:
    data:
      preprocessing:
        side: long
        resize: 512
    pipeline:
      name: reconstruction.mast3r_sfm
      doppelgangers:
        threshold: 0.8
  megadepth1500:
    data:
      preprocessing:
        side: long
        resize: 512
    eval:
      estimator: opencv
      ransac_th: 1.5
