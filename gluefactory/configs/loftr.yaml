model:
  name: two_view_pipeline
  matcher:
    name: gluefactory_nonfree.loftr
    weights: ../LoFTR/weights/outdoor_ds.ckpt
    mconf_thr: 0.2
    zero_pad: true
data:
  preprocessing:
    side: long
    resize: 840
benchmarks:
  megadepth1500:
    data:
      preprocessing:
        side: long
        resize: 840
    eval:
      estimator: [poselib,opencv]
      ransac_th: -1
  scannet1500:
    data:
      preprocessing:
        side: long
        resize: 640
    model:
      matcher:
        mconf_thr: 0.2
        zero_pad: false
    eval:
      estimator: [poselib,opencv]
      ransac_th: -1
